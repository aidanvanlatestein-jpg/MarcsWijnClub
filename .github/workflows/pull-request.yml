# Bij elke pull request naar main: de controles, en wat er in productie zou veranderen.
name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  controles:
    uses: ./.github/workflows/controles.yml

  diff:
    name: Wijzigingen in productie (cdk diff)
    needs: controles
    # De repository is openbaar. Een pull request uit een fork krijgt nooit toegang tot AWS.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # De diff is informatie; hij houdt de pull request niet tegen.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AFZENDER_EMAIL: ${{ secrets.AFZENDER_EMAIL }}
      AWS_REGIO: ${{ vars.AWS_REGIO || 'eu-west-1' }}
    steps:
      - name: Instellingen aanwezig?
        id: klaar
        run: |
          if [ -n "$AWS_ACCOUNT_ID" ] && [ -n "$AFZENDER_EMAIL" ]; then
            echo "ja=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS_ACCOUNT_ID of AFZENDER_EMAIL ontbreekt in de geheimen van de repository; geen diff."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.klaar.outputs.ja == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.klaar.outputs.ja == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.klaar.outputs.ja == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: Afhankelijkheden en web-app
        if: steps.klaar.outputs.ja == 'true'
        run: |
          pip install -r infra/requirements.txt
          cd app && npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.klaar.outputs.ja == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/wijnclub-github-lezen
          role-session-name: pull-request-${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGIO }}
      # De rol mag alleen de sjablonen van de stacks lezen. De CLI meldt daarom dat hij de
      # leesrol van CDK niet kan aannemen en gaat verder met deze rol; dat is de bedoeling.
      - name: Diff tegen productie
        if: steps.klaar.outputs.ja == 'true'
        working-directory: infra
        run: |
          {
            echo "### Wat er in productie verandert"
            echo '```'
            npx --yes aws-cdk@2.1149.0 diff "Wijnclub-prod-*" --change-set=false \
              -c omgeving=prod -c regio="$AWS_REGIO" -c afzender_email="$AFZENDER_EMAIL" 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
