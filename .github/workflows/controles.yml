# De controles die elke andere workflow eerst draait. Raakt AWS niet.
# Elke Action staat vast op een commit-hash; het versienummer staat erachter.
name: Controles

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python-code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            infra/requirements.txt
      - name: Afhankelijkheden installeren
        run: pip install -r requirements-dev.txt
      - name: Stijl en fouten (ruff)
        run: ruff check --output-format=github .
      - name: Bekende kwetsbaarheden (pip-audit)
        run: pip-audit -r requirements-dev.txt
      - name: Typen controleren (mypy)
        run: mypy
      # De dekking gaat over functions/wijnclub, nu ook opslag.py via de integratietests tegen DynamoDB
      # in het geheugen (moto). Zakt het totaal onder 95%, dan faalt de stap. Zonder moto falen de
      # integratietests in plaats van over te slaan.
      - name: Unit-, integratie- en stacktests (pytest), met dekking van de functies
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
          WIJNCLUB_INTEGRATIE: verplicht
        run: pytest --cov=wijnclub --cov-report=term-missing:skip-covered --cov-fail-under=95

  web:
    name: Web-app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Afhankelijkheden installeren
        run: npm ci
      - name: Bekende kwetsbaarheden (npm audit)
        run: npm audit --audit-level=high
      # De staat van het prototype, de hulpjes en de regels die ook in functions/wijnclub/domein staan.
      - name: Unit-tests (vitest)
        run: npm test
      - name: Typen controleren en bouwen
        run: npm run build

  # De eisen voor de telefoon uit hoofdstuk 10 van de bouwspecificatie en de uitkomsten van bestellen,
  # betalen en bieden, in Chromium en in WebKit (de motor van Safari op de iPhone), op 375 x 667 en
  # 320 x 568 px. Tegen de gebouwde web-app; raakt AWS niet.
  telefoon:
    name: Web-app op telefoonformaat (Playwright)
    runs-on: ubuntu-24.04
    env:
      WIJNCLUB_BROWSERTESTS: verplicht
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            infra/requirements.txt
      - name: Web-app bouwen
        working-directory: app
        run: npm ci && npm run build
      - name: Afhankelijkheden en browser installeren
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium-headless-shell webkit
      - name: Browsertests (pytest)
        run: pytest tests/web

  infra:
    name: Infrastructuur (cdk synth)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: Afhankelijkheden installeren
        run: pip install -r infra/requirements.txt
      - name: Web-app bouwen
        working-directory: app
        run: npm ci && npm run build
      # Een voorbeeldadres is genoeg om de sjablonen te bouwen; uitrollen gebeurt hier niet.
      - name: Sjablonen voor test en productie
        working-directory: infra
        run: |
          npx --yes aws-cdk@2.1149.0 synth --quiet -c omgeving=test -c afzender_email=noreply@voorbeeld.nl
          npx --yes aws-cdk@2.1149.0 synth --quiet -c omgeving=prod -c afzender_email=noreply@voorbeeld.nl
