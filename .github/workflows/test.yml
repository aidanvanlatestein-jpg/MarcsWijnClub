# Bij elke merge naar main: de controles, de uitrol naar de teststack en de rooktest daarop.
name: Uitrol naar test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nooit twee uitrollen tegelijk; een nieuwe wacht tot de vorige klaar is.
concurrency:
  group: uitrol-test
  cancel-in-progress: false

jobs:
  controles:
    uses: ./.github/workflows/controles.yml

  uitrol:
    name: Uitrol en rooktest
    needs: controles
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AFZENDER_EMAIL: ${{ secrets.AFZENDER_EMAIL }}
      AWS_REGIO: ${{ vars.AWS_REGIO || 'eu-west-1' }}
    steps:
      - name: Instellingen aanwezig?
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ] || [ -z "$AFZENDER_EMAIL" ]; then
            echo "::error::Zet AWS_ACCOUNT_ID en AFZENDER_EMAIL als geheim in de repository (Settings, Secrets and variables, Actions)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/voorbereiden
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/wijnclub-github-test
          role-session-name: test-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGIO }}
      - name: Uitrollen naar test
        working-directory: infra
        run: |
          npx --yes aws-cdk@2.1149.0 deploy "Wijnclub-test-*" --require-approval never \
            -c omgeving=test -c regio="$AWS_REGIO" -c afzender_email="$AFZENDER_EMAIL" \
            --outputs-file "$RUNNER_TEMP/cdk-uitvoer.json"
      - name: Rooktest
        run: |
          export WIJNCLUB_ADRES="$(python -c "import json, os; print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'cdk-uitvoer.json')))['Wijnclub-test-Web']['Adres'])")"
          echo "Adres van test: $WIJNCLUB_ADRES" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/smoke
